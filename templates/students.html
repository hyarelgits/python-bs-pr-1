<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

<h1>Student List</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Marks</th>
</tr>

{% for row in rows %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
