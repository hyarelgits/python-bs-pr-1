<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

    <h1>Add Student</h1>

    <form method="POST">

        <label>Student Name:</label>
        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>Marks:</label>
        <input
            type="number"
            name="marks"
            required
        >

        <br><br>

        <button type="submit">
            Save Student
        </button>

    </form>

    <br>

    <a href="/">Back Home</a>

</body>
</html>
